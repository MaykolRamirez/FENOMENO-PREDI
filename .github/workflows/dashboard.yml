# Publica el Monitor El Niño Perú en GitHub Pages.
# Corre todos los días a las 6:30 a. m. de Lima (11:30 UTC), cada vez que cambia el tablero y a mano
# (Actions -> "Monitor El Niño" -> Run workflow). Descarga los datos del día, arma el sitio y lo publica.
# El sitio queda en https://<usuario>.github.io/<repositorio>/ (Settings -> Pages -> Source: GitHub Actions).
name: Monitor El Niño

on:
  schedule:
    - cron: "30 11 * * *"
  push:
    branches: [main]
    paths: ["dashboard/**", "src/clima_nino.py", ".github/workflows/dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar librerías
        run: pip install -q pandas numpy requests
      - name: Temperatura del mar (NOAA e ICEN)
        run: cd src && python temperatura_mar.py
        continue-on-error: true
      - name: Datos del tablero (lluvia, mar, riesgo)
        run: cd src && python clima_nino.py
      - name: Imágenes Sentinel-2 antes y ahora
        run: cd src && python imagenes_satelite.py
        continue-on-error: true
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r dashboard/* _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
