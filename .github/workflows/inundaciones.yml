# Inundaciones en Tumbes y Piura: exposición (una vez), huellas de radar Sentinel-1 y su impacto.
# Corre los lunes y jueves (Sentinel-1 pasa cada 6-12 días) y cuando se lanza a mano.
name: Inundaciones Tumbes y Piura

on:
  schedule:
    - cron: "41 14 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  inundaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt -r requirements-inundaciones.txt
      - run: pip install -q -r requirements-dev.txt
      - name: ETL de inundaciones (exposición, Sentinel-1, impacto, panel, metadatos; registra fallos)
        run: python -u src/etl.py inundacion
      - name: Exposición adicional (edades, cultivos, vías) e impacto adicional
        run: python -u src/exposicion_extra.py && python -u src/impacto_extra.py
        continue-on-error: true
      - name: Pruebas de consistencia antes de guardar (si fallan, se conserva el último resultado válido)
        run: python -m pytest -q tests/test_datos.py tests/test_unidades.py
      - name: Guardar
        run: |
          git config user.name "Actualización automática"
          git config user.email "actions@users.noreply.github.com"
          git add data/exposicion data/huellas data/registro data/versiones dashboard/data docs/evidencia || true
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Inundaciones: actualiza huellas e impacto $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
