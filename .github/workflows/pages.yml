# Publica el tablero (carpeta dashboard/) en GitHub Pages cada vez que cambia o se actualizan los datos.
name: Publicar tablero

on:
  push:
    branches: [main]
    paths: ["dashboard/**"]
  workflow_run:
    workflows: ["Actualizar datos", "Inundaciones Tumbes y Piura", "Base para el modelo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
