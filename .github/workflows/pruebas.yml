# Pruebas unitarias, de integración de datos, de consistencia geoespacial y smoke test del sitio.
# Corre en cada push/PR y después de cada actualización automática de datos.
name: Pruebas

on:
  push:
  pull_request:
  workflow_run:
    workflows: ["Actualizar datos", "Inundaciones Tumbes y Piura", "Base para el modelo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt -r requirements-inundaciones.txt -r requirements-dev.txt
      - name: Estado de las capas (advierte si hay datos rezagados)
        run: |
          python -u src/metadatos.py | tee /tmp/estado.txt
          grep -E "^\s+(rezagado|no disponible)" /tmp/estado.txt | while read -r linea; do echo "::warning title=Capa desactualizada::$linea"; done
      - run: python -m pytest -q
      - name: Smoke test del sitio publicado
        if: github.ref == 'refs/heads/main'
        env:
          IAPN_URL_SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python -m pytest -q tests/test_sitio.py || echo "::warning title=Sitio publicado::el smoke test contra GitHub Pages falló (puede ser que el despliegue aún no incluya mapa2d.html)"
